# Consolidated map of every bibtex key (from references.bib) that gets its own
# entry on the Publications page, to its category and (if on hand) TOC/
# graphical-abstract figure in assets/TOC/. Publications.md renders a
# publication card (figure + citation) for entries with an image, and a plain
# citation for entries without one.
#
# category: independent | preprint | collab
#   independent - Franck Lab (Syracuse/ACERT) independent-research papers
#   preprint    - preprints not yet in a journal
#   collab      - collaborative work led by other groups
#
# Add `image: assets/TOC/<file>` to the matching entry once a real
# graphical-abstract image is found. Add a brand-new entry (with or without
# an image) for each newly published/preprinted paper.

