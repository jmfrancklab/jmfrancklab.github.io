# Lab members, except the PI (who has a hand-written section directly in
# People.md). status: active | alumnus. level: PhD | Masters | postdoc |
# undergrad. university: the institution this person is/was enrolled at
# (shown next to their level on People.md) -- required for everyone. When
# status is active, People.md displays this as "current <level> student"
# (or "current postdoc" for postdocs); when alumnus, it displays just the
# level.
- name: Atahan Garip
  status: active
  level: PhD
  university: Cornell University
  photo: assets/atahan_photo.png
  description: |
    Atahan is a PhD student in the Applied and Engineering Physics program
    at Cornell University, working with the Franck Lab at ACERT.
    He is developing a fully open and automated temperature-controlled
    ODNP system.

- name: Romana Shathy
  status: active
  level: PhD
  university: Syracuse University
  photo: assets/romana_photo_top.png
  description: |
    Romana synthesizes small molecule spin labels that allow her to probe the
    microviscosity (*via* ESR)
    and the local diffusivity (*via* ODNP) of small pockets of water.
    Beginning with reverse micelles, she plans to expand her studies to
    a variety of (especially energy-relevant) porous materials.
    During the lab's transition to ACERT, Romana also gained additional
    research experience in Prof. Xiaoran Hu's group.

- name: Warren Kincaid
  status: active
  level: PhD
  university: Syracuse University
  photo: assets/warren_photo.png
  description: |
    Warren has two projects:
    In one, he develops efficient protocols for site-directed spin labeling and
    expression of the light-activated proton pump proteorhodopsin,
    and investigates sites with anomalous hydration along the surface
    or proteorhodopsin.
    In the other project, he employes Ansys Electronics
    to design dual NMR-ESR resonators with improved sensitivity.
    He focuses on developing new simulation protocols that apply
    broadly to the design of couple microwave resonators.
    During the lab's transition to ACERT, Warren also gained additional
    research experience in [Prof. Songi Han's lab](People.html#songi-han).

- name: Alexandria Guinness
  status: alumnus
  level: PhD
  university: Syracuse University
  photo: assets/alex_photo.png
  description: |
    Alex automated large portions of the ODNP experiment and data
    processing,
    and performed detailed investigations to improve the sensitivity of the
    ODNP measurement, applying these techniques to the study of hydration
    water on the surface of Ras.
    Alex graduated with a PhD and now works at Lotte, near Syracuse.

- name: Alec Beaton
  status: alumnus
  level: PhD
  university: Syracuse University
  photo: assets/alec_photo.png
  website: https://www.linkedin.com/in/alecbeaton
  description: |
    Alec employed both ODNP and <sup>2</sup>H NMR to observe confined water inside reverse micelles.

    He also pioneered the DCCT technique for the display of maximally multiplexed information about the various coherence pathway signals present in an NMR experiment; he applied this technique to identify faint signals in low-field NMR and to perform mean-field-averaged correlation alignment to dramatically improve signal to noise and signal quality in the presence of variable magnetic fields.

    Alec currently works at Bruker Biospin.

- name: Farhana Syed
  status: alumnus
  level: postdoc
  university: Syracuse University
  photo: assets/farhana_photo.png
  description: |
    Farhana performed site-directed spin labeling on the protein K-Ras.

- name: Samantha Betts
  status: alumnus
  level: Masters
  university: Syracuse University
  photo: assets/SMBetts_Image.png
  description: |
    Sam refined a protocol for the expression and site-directed spin labeling of Proteorhodopsin, and also worked on overmodulation reconstruction.
    Sam currently works at the Aldon Corporation as a Product Developer.

- name: Natasha Prince
